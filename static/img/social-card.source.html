<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap");
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: "Montserrat", "Liberation Sans", "DejaVu Sans", sans-serif;
    background: #07202D;
    color: #FAF7F2;
    position: relative;
    overflow: hidden;
  }
  .glow {
    position: absolute;
    width: 900px; height: 900px;
    border-radius: 50%;
    background: radial-gradient(circle, rgb(254 127 45 / 0.42) 0%, rgb(254 127 45 / 0.10) 42%, transparent 68%);
    top: -380px; right: -240px;
  }
  .glow2 {
    position: absolute;
    width: 620px; height: 620px;
    border-radius: 50%;
    background: radial-gradient(circle, rgb(252 202 70 / 0.20) 0%, transparent 66%);
    bottom: -320px; left: -160px;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(hsl(0 0% 100% / 0.045) 1px, transparent 1px),
      linear-gradient(90deg, hsl(0 0% 100% / 0.045) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: linear-gradient(160deg, #000 0%, transparent 70%);
  }
  .inner {
    position: relative;
    height: 100%;
    padding: 76px 84px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-size: 21px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #FEAF84;
    font-weight: 700;
  }
  .eyebrow::before {
    content: "";
    width: 34px; height: 3px;
    background: #FE7F2D;
    border-radius: 2px;
  }
  h1 {
    font-size: 82px;
    line-height: 1.04;
    font-weight: 700;
    letter-spacing: -0.025em;
    max-width: 930px;
  }
  h1 .accent {
    background: linear-gradient(95deg, #FE7F2D, #FCCA46);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  p.sub {
    margin-top: 26px;
    font-size: 30px;
    line-height: 1.42;
    color: #D0DDE6;
    max-width: 860px;
  }
  .foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 18px;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .mark {
    width: 56px; height: 56px;
    border-radius: 50%;
    flex: none;
    display: block;
  }
  .url {
    font-family: "DejaVu Sans Mono", monospace;
    font-size: 23px;
    color: #9BAEBB;
  }
</style>
</head>
